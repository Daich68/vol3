<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vol-3 reel</title>
  <link rel="stylesheet" href="reel.css">
</head>
<body>
<div id="viewport">
  <div id="stage">

    <!-- Real screen recordings of the app (record.mjs → .cache/takes). -->
    <div id="shots"></div>

    <!-- Cursor and finger, drawn from each take's track. -->
    <div id="pointer">
      <svg class="p-arrow" viewBox="0 0 24 36" aria-hidden="true">
        <path d="M2 2 L2 28 L8.5 22 L13 33 L17 31.2 L12.6 20.6 L21 20.6 Z" fill="#111" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>
      </svg>
      <svg class="p-hand" viewBox="0 0 32 36" aria-hidden="true">
        <path d="M11 3.5c0-1.4 1.1-2.5 2.5-2.5S16 2.1 16 3.5v10.3l1-.3V11c0-1.4 1.1-2.5 2.5-2.5S22 9.6 22 11v3.2l1-.2v-1.4c0-1.4 1.1-2.5 2.5-2.5S28 11.2 28 12.6V24c0 5.5-4.5 10-10 10h-2.6c-3 0-5.8-1.5-7.5-4L3.4 23.2c-.8-1.2-.5-2.8.7-3.6 1.1-.7 2.6-.5 3.4.6L11 25V3.5z" fill="#fff" stroke="#111" stroke-width="1.8" stroke-linejoin="round"/>
      </svg>
    </div>
    <div id="touch"><i class="t-dot"></i><i class="t-ring"></i></div>

    <!-- End card -->
    <section id="end">
      <img class="end-logo" src="../public/logo%20[Vectorized].svg" alt="Vol-3">
      <div class="end-qrs">
        <figure class="qr"><div class="qr-code" data-src="assets/qr/telegram.svg"></div><figcaption>t.me/vastu_sastra</figcaption></figure>
        <figure class="qr"><div class="qr-code" data-src="assets/qr/site.svg"></div><figcaption>vol-3.web-almanac.com</figcaption></figure>
      </div>
    </section>

  </div>
</div>

<div id="controls">
  <button id="play">play</button>
  <input id="scrub" type="range" min="0" max="1000" value="0">
  <span id="time">0.00</span>
</div>

<script src="../node_modules/gsap/dist/gsap.min.js"></script>
<script src="reel.js"></script>
</body>
</html>
